name: Verify migration metadata

on:
  pull_request:
    paths:
      - app/layout.tsx
      - package.json
      - scripts/verify-migration-metadata.mjs
      - .github/workflows/verify-migration-metadata.yml
  push:
    paths:
      - app/layout.tsx
      - package.json
      - scripts/verify-migration-metadata.mjs
      - .github/workflows/verify-migration-metadata.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record checked commit
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Verify migration metadata contract
        run: node scripts/verify-migration-metadata.mjs
